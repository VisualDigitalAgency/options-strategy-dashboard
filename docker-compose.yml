# Theta Desk: docker compose up -d   (first: python scripts/make_secrets.py, and copy .env.example to .env)
# Only Caddy (web) publishes ports. Postgres and Redis sit on an internal network with no internet access.

x-app: &app
  build: { context: ., target: app }
  image: theta-desk-app:latest
  restart: unless-stopped
  environment:
    DB_HOST: postgres
    DB_PASSWORD_FILE: /run/secrets/db_app_password
    REDIS_HOST: redis
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@theta.local}
    TZ: Asia/Kolkata
  secrets: [db_app_password, redis_password]
  volumes:
    - app_cache:/app/engine/cache      # SPAN files + last screen, shared by api and worker
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [data, default]   # data: Postgres + Redis; default: Caddy and outbound calls to NSE

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: theta_owner
      POSTGRES_DB: theta
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password, db_app_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theta_owner -d theta"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    # Password from the secret file; commands that wipe or reconfigure Redis are switched off.
    command: >
      sh -c 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes
      --protected-mode yes --rename-command FLUSHALL "" --rename-command FLUSHDB ""
      --rename-command CONFIG "" --rename-command DEBUG "" --rename-command KEYS ""'
    secrets: [redis_password]
    volumes: [redis_data:/data]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      OWNER_DB_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    volumes: []
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@theta.local}
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: ${PUBLIC_URL:-https://${DOMAIN}}
      TZ: Asia/Kolkata
      BROKER_ENC_KEY_FILE: /run/secrets/broker_enc_key
      BROKER_ENC_KEY_PREVIOUS: ${BROKER_ENC_KEY_PREVIOUS:-}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET_FILE: /run/secrets/kite_api_secret
      KITE_REDIRECT_URL: ${KITE_REDIRECT_URL:-}
    secrets: [db_app_password, redis_password, broker_enc_key, kite_api_secret]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "engine.worker"]
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@theta.local}
      TZ: Asia/Kolkata
      BROKER_ENC_KEY_FILE: /run/secrets/broker_enc_key
      BROKER_ENC_KEY_PREVIOUS: ${BROKER_ENC_KEY_PREVIOUS:-}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET_FILE: /run/secrets/kite_api_secret
    secrets: [db_app_password, redis_password, broker_enc_key, kite_api_secret]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "engine.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # a standby waits up to a minute for the lock

  web:
    build: { context: ., target: web }
    image: theta-desk-web:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data           # TLS certificates: keep across restarts or Let's Encrypt rate limits bite
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [default]

secrets:
  db_owner_password: { file: ./secrets/db_owner_password }
  db_app_password: { file: ./secrets/db_app_password }
  redis_password: { file: ./secrets/redis_password }
  broker_enc_key: { file: ./secrets/broker_enc_key }
  kite_api_secret: { file: ./secrets/kite_api_secret }

volumes:
  pg_data:
  redis_data:
  app_cache:
  caddy_data:
  caddy_config:

networks:
  data: { internal: true }   # Postgres and Redis: no internet, reachable only by the app containers
  default: {}
