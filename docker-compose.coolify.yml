# Coolify deployment variant of docker-compose.yml. Only the `web` service differs: it no
# longer publishes host ports or manages its own TLS certificate, because Coolify's Traefik
# proxy already owns 80/443 on the host and terminates TLS for the domain assigned to this
# service (Settings > this app > Domains). Postgres/Redis volumes are unchanged, so existing
# data is untouched if you ever move a deployment between the two compose files.
# See docker-compose.yml for the plain self-hosted (own Caddy + own TLS) version.

x-app: &app
  build: { context: ., target: app }
  image: theta-desk-app:latest
  restart: unless-stopped
  environment:
    DB_HOST: postgres
    DB_PASSWORD_FILE: /run/secrets/db_app_password
    REDIS_HOST: redis
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@theta.local}
    TZ: Asia/Kolkata
  secrets: [db_app_password, redis_password]
  volumes:
    - app_cache:/app/engine/cache
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [data, default]

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: theta_owner
      POSTGRES_DB: theta
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password, db_app_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theta_owner -d theta"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: >
      sh -c 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes
      --protected-mode yes --rename-command FLUSHALL "" --rename-command FLUSHDB ""
      --rename-command CONFIG "" --rename-command DEBUG "" --rename-command KEYS ""'
    secrets: [redis_password]
    volumes: [redis_data:/data]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      OWNER_DB_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@theta.local}
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: ${PUBLIC_URL:-https://${DOMAIN}}
      TZ: Asia/Kolkata
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "engine.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "engine.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  web:
    build: { context: ., target: web }
    image: theta-desk-web:latest
    restart: unless-stopped
    expose: ["80"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/Caddyfile.coolify:/etc/caddy/Caddyfile:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [default]

secrets:
  db_owner_password: { file: ./secrets/db_owner_password }
  db_app_password: { file: ./secrets/db_app_password }
  redis_password: { file: ./secrets/redis_password }

volumes:
  pg_data:
  redis_data:
  app_cache:
  caddy_data:
  caddy_config:

networks:
  data: { internal: true }
  default: {}
